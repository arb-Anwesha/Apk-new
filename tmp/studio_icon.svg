<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C0519" />
      <stop offset="50%" stop-color="#881337" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFCA28" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Studio Decorative Circles -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2" stroke-dasharray="12 12" />

  <!-- Main Camera Studio Group with Shadow -->
  <g filter="url(#shadow)">
    <!-- Video Camera Body -->
    <rect x="110" y="180" width="220" height="160" rx="36" fill="url(#goldGrad)" />
    
    <!-- Camera Lens / Projector Cone -->
    <path d="M330 220 L405 170 C415 163 425 170 425 182 L425 330 C425 342 415 349 405 342 L330 292 Z" fill="url(#goldGrad)" />
    
    <!-- Camera Lens Rings Inside Body -->
    <circle cx="205" cy="260" r="50" fill="#4C0519" />
    <circle cx="205" cy="260" r="38" fill="#FFFFFF" fill-opacity="0.15" />
    <polygon points="195,242 225,260 195,278" fill="#FFE082" />
    
    <!-- Dual Film Reels on top of camera -->
    <circle cx="165" cy="145" r="38" fill="url(#goldGrad)" />
    <circle cx="165" cy="145" r="22" fill="#4C0519" />
    <circle cx="165" cy="145" r="8" fill="#FFE082" />

    <circle cx="255" cy="145" r="38" fill="url(#goldGrad)" />
    <circle cx="255" cy="145" r="22" fill="#4C0519" />
    <circle cx="255" cy="145" r="8" fill="#FFE082" />

    <!-- AI Sparkle Magic Elements -->
    <!-- Top-Right Sparkle -->
    <path d="M375 110 Q375 135 395 135 Q375 135 375 160 Q375 135 355 135 Q375 135 375 110 Z" fill="#FFFFFF" />
    <!-- Small spark -->
    <path d="M320 100 Q320 114 330 114 Q320 114 320 128 Q320 114 310 114 Q320 114 320 100 Z" fill="#FFE082" />
    <!-- Bottom spark -->
    <path d="M110 370 Q110 388 124 388 Q110 388 110 406 Q110 388 96 388 Q110 388 110 370 Z" fill="#FFE082" />
    
    <!-- Sound wave / Studio bars -->
    <rect x="135" y="365" width="8" height="24" rx="4" fill="#FFFFFF" fill-opacity="0.7" />
    <rect x="155" y="355" width="8" height="44" rx="4" fill="#FFE082" />
    <rect x="175" y="360" width="8" height="34" rx="4" fill="#FFFFFF" fill-opacity="0.7" />
    <rect x="195" y="350" width="8" height="54" rx="4" fill="#FFE082" />
  </g>
</svg>
